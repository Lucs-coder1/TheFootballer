<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheFootballer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%230A1B3D'/%3E%3Cpath d='M12 6.5 16.5 9.5 15 14.5H9L7.5 9.5Z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ===== Design plan =====
   Color: --navy (deep ground), --blue (primary accent), --sky (secondary accent),
          --ink (text), --paper (page bg), --surface (card bg), --line (hairline), --muted (secondary text)
   Type: --f-display (Anton, condensed sports headline), --f-body (Work Sans), --f-mono (JetBrains Mono, scores/stats)
   Layout: app shell — fixed sidebar nav (desktop) / bottom tab bar (phone), sticky topbar, card-grid content column
*/
:root{
  --navy:#0A1B3D; --blue:#1452D6; --sky:#4FA3FF;
  --ink:#0E1C33; --paper:#F3F6FC; --surface:#FFFFFF; --line:#DCE6F7; --muted:#5B6B8C;
  --good:#1E8F6F; --bad:#D6455A; --warn:#C98A1E;
  --f-display:'Anton',"Arial Narrow",sans-serif;
  --f-body:'Work Sans',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#060D1F; --blue:#5B93FF; --sky:#7FC1FF;
    --ink:#E8EFFC; --paper:#081330; --surface:#0F2144; --line:#1E3864; --muted:#8CA3CC;
    --good:#3FBF93; --bad:#FF6B7F; --warn:#E3A83E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --navy:#060D1F; --blue:#5B93FF; --sky:#7FC1FF;
  --ink:#E8EFFC; --paper:#081330; --surface:#0F2144; --line:#1E3864; --muted:#8CA3CC;
  --good:#3FBF93; --bad:#FF6B7F; --warn:#E3A83E;
  color-scheme: dark;
}
*{box-sizing:border-box;}
[hidden]{display:none!important;}
body{font-family:var(--f-body);background:var(--paper);color:var(--ink);min-height:100%;}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;letter-spacing:.3px;text-wrap:balance;margin:0;}
p{margin:0;line-height:1.5;}
button{font-family:inherit;cursor:pointer;}
a{color:var(--blue);}
.hairline{border:1px solid var(--line);}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}
.muted{color:var(--muted);}
::selection{background:var(--sky);color:#fff;}

/* ---------- App shell ---------- */
#app{min-height:100%;}
.shell{display:flex;min-height:100%;}
.sidebar{
  width:224px;flex:none;background:var(--navy);color:#fff;
  display:flex;flex-direction:column;gap:4px;padding:18px 14px;
  position:sticky;top:0;align-self:flex-start;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;color:#fff;}
.brand svg{flex:none;}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:.5px;}
.navitem{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;
  background:transparent;border:none;color:#C9D8F5;text-align:left;font-size:14.5px;font-weight:600;
}
.navitem svg{flex:none;opacity:.9;}
.navitem:hover{background:rgba(255,255,255,.08);color:#fff;}
.navitem.active{background:var(--blue);color:#fff;}
.sidebar .spacer{flex:1;}
.sidebar .meta{padding:10px 12px;color:#7F96C9;font-size:12px;}

.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  display:flex;align-items:center;gap:12px;padding:12px 20px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.topbar .page-title{font-size:20px;flex:1;min-width:0;}
.iconbtn{
  display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;
  background:transparent;border:1px solid var(--line);color:var(--ink);flex:none;
}
.iconbtn:hover{border-color:var(--blue);color:var(--blue);}
.chip-user{
  display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;
  background:var(--paper);border:1px solid var(--line);flex:none;
}
.avatar{
  width:28px;height:28px;border-radius:999px;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;
}
.main{flex:1;min-width:0;padding:22px 24px 90px;max-width:1080px;margin:0 auto;width:100%;}
.view{display:flex;flex-direction:column;gap:22px;}

.bottomnav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:6;
  background:var(--surface);border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
  justify-content:space-between;gap:2px;
}
.bottomnav button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:600;padding:4px 2px;border-radius:8px;min-width:0;
}
.bottomnav button.active{color:var(--blue);}

@media (max-width:900px){
  .sidebar{display:none;}
  .bottomnav{display:flex;}
  .main{padding:16px 14px 90px;}
}

/* ---------- Section headers / layout bits ---------- */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.section-head h2{font-size:24px;}
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;}
.tabs button{background:none;border:none;border-radius:9px;padding:8px 16px;font-size:13.5px;font-weight:700;color:var(--muted);}
.tabs button.active{background:var(--blue);color:#fff;}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:12.5px;font-weight:600;color:var(--muted);
}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;}
.empty{
  border:1.5px dashed var(--line);border-radius:14px;padding:32px 20px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);
}
.empty svg{opacity:.5;}

/* ---------- Buttons / forms ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:10px;border:none;font-weight:700;font-size:14px;
  background:var(--blue);color:#fff;
}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue);}
.btn.subtle{background:var(--paper);color:var(--ink);border:1px solid var(--line);}
.btn.sm{padding:7px 14px;font-size:12.5px;}
.btn.block{width:100%;}
input[type=text],input[type=number],input[type=password],select{
  font-family:inherit;font-size:14px;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);width:100%;
}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--sky);outline-offset:1px;}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted);}

/* ---------- Onboarding / Auth ---------- */
.onboarding{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 18px;background:
  radial-gradient(1200px 500px at 50% -10%, color-mix(in srgb, var(--blue) 18%, transparent), transparent),var(--navy);}
.ob-card{width:100%;max-width:480px;background:var(--surface);border-radius:20px;padding:28px 26px 26px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);}
.ob-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:18px;color:var(--navy);}
.ob-logo b{font-family:var(--f-display);font-size:24px;}
.ob-progress{display:flex;gap:6px;margin-bottom:20px;}
.ob-progress i{flex:1;height:5px;border-radius:999px;background:var(--line);display:block;}
.ob-progress i.on{background:var(--blue);}
.ob-step h3{font-size:21px;margin-bottom:4px;}
.ob-step p.sub{color:var(--muted);font-size:13.5px;margin-bottom:16px;}
.pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:340px;overflow-y:auto;padding:2px;margin-bottom:6px;}
.pickgrid.single{grid-template-columns:1fr 1fr 1fr;}
.pickitem{
  display:flex;align-items:center;gap:8px;padding:10px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--paper);font-size:12.5px;font-weight:700;color:var(--ink);text-align:left;
}
.pickitem small{display:block;font-weight:500;color:var(--muted);font-size:10.5px;}
.pickitem.sel{border-color:var(--blue);background:color-mix(in srgb, var(--blue) 10%, var(--surface));}
.pickitem .crest{width:26px;height:26px;flex:none;}
.ob-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;}
.ob-counter{font-size:11.5px;color:var(--muted);text-align:right;margin-bottom:8px;}
.ob-error{color:var(--bad);font-size:12.5px;font-weight:600;min-height:16px;}
.ob-hint{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.authtabs{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px;}
.authtabs button{flex:1;background:none;border:none;border-radius:9px;padding:9px 0;font-size:13.5px;font-weight:700;color:var(--muted);}
.authtabs button.active{background:var(--blue);color:#fff;}
.ob-step label.field{margin-bottom:12px;}

/* ---------- News ---------- */
.news-card{overflow:hidden;padding:0;}
.news-art{height:108px;position:relative;display:flex;align-items:flex-end;padding:10px 12px;overflow:hidden;}
.news-art span.tag{
  background:rgba(10,20,40,.55);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;padding:4px 9px;border-radius:999px;backdrop-filter:blur(2px);
}
.news-crests{position:absolute;top:10px;right:10px;display:flex;align-items:center;}
.news-crests > :nth-child(2){margin-left:-10px;}
.news-iconwm{position:absolute;top:6px;right:8px;opacity:.28;color:#fff;}
.news-body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:7px;}
.news-body h4{font-size:15.5px;line-height:1.3;}
.news-body p{font-size:13px;color:var(--muted);}
.news-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-top:2px;}
.news-foot b{color:var(--blue);}

/* ---------- Tutorials ---------- */
.tut-card{cursor:pointer;}
.tut-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
.badge{padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.3px;}
.badge.lvl-Beginner{background:color-mix(in srgb, var(--good) 18%, var(--surface));color:var(--good);}
.badge.lvl-Intermediate{background:color-mix(in srgb, var(--warn) 18%, var(--surface));color:var(--warn);}
.badge.lvl-Advanced{background:color-mix(in srgb, var(--bad) 18%, var(--surface));color:var(--bad);}
.playcircle{width:46px;height:46px;border-radius:999px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
.tut-prog{height:5px;border-radius:999px;background:var(--line);overflow:hidden;}
.tut-prog b{display:block;height:100%;background:var(--blue);}

/* ---------- Modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,12,26,.5);padding:0;}
@media (min-width:640px){.modal-wrap{align-items:center;padding:20px;}}
.modal{
  background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:14px;
}
@media (min-width:640px){.modal{border-radius:18px;}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.modal-head h3{font-size:20px;}
.step-row{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);}
.step-row:first-of-type{border-top:none;}
.step-check{
  width:24px;height:24px;border-radius:999px;border:1.5px solid var(--line);flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.step-check.on{background:var(--good);border-color:var(--good);}
.cue{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);}
.cue b{color:var(--ink);}

/* ---------- Quiz ---------- */
.quiz-hero{background:var(--navy);color:#fff;border-radius:16px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;}
.quiz-hero h3{font-size:24px;color:#fff;}
.quiz-stat-row{display:flex;gap:18px;flex-wrap:wrap;}
.quiz-stat{display:flex;flex-direction:column;gap:2px;}
.quiz-stat b{font-family:var(--f-mono);font-size:20px;}
.quiz-stat span{font-size:11px;color:#9FB4E0;text-transform:uppercase;letter-spacing:.4px;}
.qcatrow{display:flex;align-items:center;gap:7px;color:#9FB4E0;font-size:11.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.qbar{height:6px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;}
.qbar b{display:block;height:100%;background:var(--blue);transition:width .25s;}
.timer-row{display:flex;align-items:center;gap:10px;}
.timer-num{font-family:var(--f-mono);font-weight:700;font-size:15px;color:#fff;min-width:30px;text-align:right;flex:none;}
.timerbar{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden;}
.timerbar b{display:block;height:100%;background:var(--sky);}
.qtext{font-size:19px;line-height:1.35;}
.qopt{
  display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);text-align:left;font-size:14px;font-weight:600;width:100%;
}
.qopt .letter{width:24px;height:24px;border-radius:7px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex:none;}
.qopt.correct{border-color:var(--good);background:color-mix(in srgb, var(--good) 12%, var(--surface));}
.qopt.wrong{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 12%, var(--surface));}
.qopt:disabled{cursor:default;}
.qfeedback{font-size:13.5px;font-weight:700;padding:11px 14px;border-radius:12px;}
.qfeedback.good{background:color-mix(in srgb, var(--good) 15%, var(--surface));color:var(--good);}
.qfeedback.bad{background:color-mix(in srgb, var(--bad) 14%, var(--surface));color:var(--bad);}

/* ---------- Predictions ---------- */
.pred-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap;}
.pred-row:first-of-type{border-top:none;}
.pred-teams{display:flex;align-items:center;gap:10px;flex:1;min-width:220px;}
.pred-team{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;min-width:0;}
.pred-team span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pred-vs{color:var(--muted);font-size:11px;}
.pred-inputs{display:flex;align-items:center;gap:6px;}
.pred-inputs input{width:44px;text-align:center;padding:8px 2px;}
.pred-pts{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.pred-pts.tier-great{background:color-mix(in srgb, var(--good) 20%, var(--surface));color:var(--good);}
.pred-pts.tier-good{background:color-mix(in srgb, var(--blue) 16%, var(--surface));color:var(--blue);}
.pred-pts.tier-low{background:color-mix(in srgb, var(--warn) 18%, var(--surface));color:var(--warn);}
.pred-pts.tier-miss{background:color-mix(in srgb, var(--bad) 14%, var(--surface));color:var(--bad);}
.pred-meta{font-size:11px;color:var(--muted);width:100%;}

/* ---------- Calendar ---------- */
.daytabs{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;}
.daytab{flex:none;min-width:56px;padding:8px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:center;font-size:11px;font-weight:700;color:var(--muted);}
.daytab b{display:block;font-size:16px;font-family:var(--f-mono);color:var(--ink);margin-top:2px;}
.daytab.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.daytab.active b{color:#fff;}
.cal-date-head{font-size:13px;font-weight:700;color:var(--ink);margin:2px 0 2px;}
.match-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap;}
.match-comp{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;width:100%;}
.match-core{display:flex;align-items:center;gap:10px;flex:1;min-width:240px;}
.match-team{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;flex:1;min-width:0;}
.match-team span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.match-score{font-family:var(--f-mono);font-size:16px;font-weight:700;white-space:nowrap;}
.match-when{font-size:11.5px;color:var(--muted);white-space:nowrap;min-width:92px;text-align:right;}
.status-pill{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;}
.status-pill.fin{background:var(--paper);color:var(--muted);}
.status-pill.up{background:color-mix(in srgb, var(--blue) 15%, var(--surface));color:var(--blue);}

/* ---------- Leaderboard ---------- */
.lb-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);}
.lb-row.me{border-color:var(--blue);background:color-mix(in srgb, var(--blue) 8%, var(--surface));}
.lb-rank{width:26px;text-align:center;font-family:var(--f-mono);font-weight:700;color:var(--muted);flex:none;}
.lb-rank.top3{color:var(--blue);}
.lb-name{flex:1;min-width:0;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;}
.lb-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-pts{font-family:var(--f-mono);font-weight:700;font-size:14.5px;}
.bottag{font-size:9px;font-weight:800;letter-spacing:.3px;padding:2px 6px;border-radius:999px;background:var(--line);color:var(--muted);flex:none;}

/* ---------- Profile ---------- */
.profile-head{display:flex;align-items:center;gap:14px;}
.profile-head .avatar{width:56px;height:56px;font-size:19px;}
.taglist{display:flex;flex-wrap:wrap;gap:7px;}
.tag{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 7px;font-size:12.5px;font-weight:700;}
</style>
</head>
<body>

<div id="app">
  <div id="onboarding" class="onboarding"></div>

  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.3 16 10l-1.5 4.7h-5L8 10z"/><path d="M12 2.5v4.8M3.3 9.2l4.7.8M3.3 14.8l4.7-.8M20.7 9.2l-4.7.8M20.7 14.8l-4.7-.8M12 21.5v-4.8"/></svg>
        <b>TheFootballer</b>
      </div>
      <nav id="sidenav"></nav>
      <div class="spacer"></div>
      <div class="meta">⚡ Live-ish since kickoff</div>
    </aside>

    <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
      <header class="topbar">
        <h1 class="page-title" id="pageTitle">Home</h1>
        <button class="iconbtn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme"></button>
        <button class="chip-user" id="profileChip">
          <span class="avatar" id="userAvatar">?</span>
          <span id="userNameChip" style="font-size:13px;font-weight:700;"></span>
        </button>
      </header>
      <main class="main">
        <section id="view-home" class="view"></section>
        <section id="view-tutorials" class="view" hidden></section>
        <section id="view-quiz" class="view" hidden></section>
        <section id="view-predictions" class="view" hidden></section>
        <section id="view-calendar" class="view" hidden></section>
        <section id="view-leaderboard" class="view" hidden></section>
        <section id="view-profile" class="view" hidden></section>
      </main>
    </div>

    <nav class="bottomnav" id="bottomnav"></nav>
  </div>

   Paste your deployed Apps Script Web App URL below to store accounts/passwords and the online

   Artifact can't reach any outside server (its sandbox blocks network calls), so a configured

var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzbo0CcBla8coT8jr4kBT3pOMEXkI5wutGkv-WySKJc53fWQbDZZbRFhvuaZ5-9GbyQTA/exec';
function hasBackend(){ return !!APPS_SCRIPT_URL; }
function backendCall(action, payload){
  payload = payload || {};
  payload.action = action;
  return fetch(APPS_SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, /* avoids a CORS preflight against Apps Script */
    body: JSON.stringify(payload)
  }).then(function(r){
    return r.text().then(function(txt){
      var parsed;
      try{ parsed = JSON.parse(txt); }
      catch(e){
        /* Not JSON back - usually means Apps Script returned an HTML page (a sign-in wall if
           "Execute as" isn't set to "Me", or an error page) instead of our doPost/doGet output. */
        var err = new Error('Backend returned non-JSON (HTTP '+r.status+'): '+txt.slice(0,160));
        err.rawStatus = r.status; err.rawBody = txt;
        throw err;
      }
      if(!r.ok){
        var err2 = new Error('Backend HTTP '+r.status+': '+(parsed && parsed.error ? parsed.error : txt.slice(0,160)));
        err2.rawStatus = r.status;
        throw err2;
      }
      return parsed;
    });
  });
}

function initials(name){
  var parts = name.trim().split(/\s+/);
  return (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();
}
function fmtDate(d){
  var diffDays = Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()))/86400000);
  var time = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  if(diffDays===0) return 'Today · '+time;
  if(diffDays===1) return 'Tomorrow · '+time;
  if(diffDays===-1) return 'Yesterday · '+time;
  var label = d.toLocaleDateString([], {month:'short',day:'numeric'});
  return label+' · '+time;
}
function dateHeadLabel(d){
  return d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
}

/* crest: blue/white shield badge, deterministic pattern + initials per team */
function crestSVG(teamId, size){
  size = size||26;
  var h = hashStr(teamId);
  var variant = h % 4;
  var shades = ['#0A1B3D','#1452D6','#2C6CF0'];
  var base = shades[h % 3];
  var uid = 'c'+teamId+size;
  var shield = 'M13 1 L24 5 L24 13 C24 19.6 19 23.6 13 25.6 C7 23.6 2 19.6 2 13 L2 5 Z';
  var defs = '<clipPath id="'+uid+'"><path d="'+shield+'"/></clipPath>';
  var inner = '';
  if(variant===0){ inner = '<path d="'+shield+'" fill="'+base+'"/>'; }
  else if(variant===1){ inner = '<path d="'+shield+'" fill="'+base+'"/><path d="'+shield+'" fill="none" stroke="#fff" stroke-width="1.6" opacity=".55"/>'; }
  else if(variant===2){ inner = '<g clip-path="url(#'+uid+')"><rect x="0" y="0" width="13" height="26" fill="'+base+'"/><rect x="13" y="0" width="13" height="26" fill="#0A1B3D"/></g>'; }
  else { inner = '<path d="'+shield+'" fill="'+base+'"/><g clip-path="url(#'+uid+')" opacity=".32" stroke="#fff" stroke-width="1"><path d="M2 5 24 23"/><path d="M24 5 2 23"/></g>'; }
  return '<svg class="crest" width="'+size+'" height="'+size+'" viewBox="0 0 26 26">'+defs+inner+
    '<text x="13" y="16" text-anchor="middle" font-family="Work Sans, sans-serif" font-size="7.6" font-weight="800" fill="#fff">'+teamId+'</text></svg>';
}

/* ============================ CRYPTO (demo-grade, client-side only) ============================ */
function randSalt(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function sha256Hex(str){
  var enc = new TextEncoder().encode(str);
  return crypto.subtle.digest('SHA-256', enc).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  });
}

function realNewsItems(matches){

  return finished.concat(upcoming).map(function(m){
    if(m.finished){
      return {
        matchId:m.rawId, home:m.home, away:m.away, homeCrest:m.homeCrest, awayCrest:m.awayCrest, comp:m.comp,
        title: m.home+' '+m.score[0]+'-'+m.score[1]+' '+m.away,

      };

      matchId:m.rawId, home:m.home, away:m.away, homeCrest:m.homeCrest, awayCrest:m.awayCrest, comp:m.comp,
      title: m.home+' vs '+m.away,

/* ============================ LIVE SCORES (optional, via Apps Script + football-data.org) ============================
   This is a real, genuinely-live panel — separate from the simulated MATCHES/predictions/calendar
   data above. It only shows real fixtures for the "big five" leagues football-data.org's free tier
   covers (Premier League, La Liga, Bundesliga, Serie A, Ligue 1), fetched through the Apps Script
   backend (so the football-data.org token never has to live in this client-side file). It's left
   separate from the curated 52-team dataset deliberately: the predictions/calendar/leaderboard
   game needs reliable, known outcomes across ALL 23 countries we added, and football-data.org's
   free tier doesn't cover most of them (no Saudi Pro League, MLS, Liga MX, J1 League, etc.), so
   merging the two would mean predictions quietly having no fixture to score most days. */
function renderLiveScoresWidget(){
  var el = document.getElementById('liveScoresWidget');
  if(!el) return;
  if(!hasBackend()){
    el.innerHTML = '';
    return;
  }
  el.innerHTML =
    '<div class="card" style="gap:0;padding:4px 16px;margin-bottom:14px;">'+
      '<div class="section-head" style="padding:10px 0;"><h3 style="font-size:15px;">Live scores</h3><p class="muted" style="font-size:11px;">via football-data.org</p></div>'+
      '<div id="liveScoresList" class="muted" style="padding:6px 0 14px;font-size:12.5px;">Loading…</div>'+
    '</div>';
  backendCall('matches', {}).then(function(res){
    var listEl = document.getElementById('liveScoresList');
    if(!listEl) return; /* user navigated away before this resolved */
    if(!res || !res.ok || !res.matches || !res.matches.length){
      listEl.textContent = (res && res.error) || 'No live fixtures from football-data.org right now.';
      return;
    }
    listEl.outerHTML = '<div id="liveScoresList" style="display:flex;flex-direction:column;gap:0;">'+
      res.matches.slice(0,8).map(function(m){
        var scoreTxt = (m.status==='FINISHED'||m.status==='IN_PLAY'||m.status==='PAUSED')
          ? (m.homeScore!=null?m.homeScore:'–')+' – '+(m.awayScore!=null?m.awayScore:'–')
          : new Date(m.utcDate).toLocaleDateString([], {month:'short',day:'numeric'})+' · '+new Date(m.utcDate).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        return '<div class="match-row" style="padding:8px 0;">'+
          '<div class="match-comp">'+escapeHTML(m.competition||'')+'</div>'+
          '<div class="match-core">'+
            '<div class="match-team"><span>'+escapeHTML(m.home)+'</span></div>'+
            '<span class="match-score mono" style="font-size:12.5px;">'+scoreTxt+'</span>'+
            '<div class="match-team" style="justify-content:flex-end;text-align:right;"><span>'+escapeHTML(m.away)+'</span></div>'+
          '</div>'+
        '</div>';
      }).join('')+
    '</div>';
  }).catch(function(err){
    var listEl = document.getElementById('liveScoresList');
    if(listEl) listEl.textContent = 'Could not reach the live scores backend. '+(err&&err.message?err.message:'');
    try{ console.error('[liveScores]', err); }catch(e){}
  });
}

/* ============================ REAL MATCH DATA (news / calendar / predictions, via Apps Script + football-data.org) ============================
   Separate dataset from the curated 52-team one above, same reasoning as the Live Scores panel:
   only covers the big-five leagues the free football-data.org tier gives us, fetched once per
   page load and cached in REAL_MATCHES. Falls back to the curated simulated system everywhere
   hasBackend() is false, so the Claude Artifact preview keeps working exactly as before. */
var REAL_MATCHES = null;
var REAL_MATCHES_PROMISE = null;
function normalizeRealMatch(m){
  return {
    id: 'fd'+m.id, rawId: m.id,
    home: m.home, away: m.away,
    homeCrest: m.homeCrest||'', awayCrest: m.awayCrest||'',
    comp: m.competition, venue: m.venue||'',
    date: new Date(m.utcDate), status: m.status,
    finished: m.status==='FINISHED',
    score: [ (m.homeScore!=null?m.homeScore:null), (m.awayScore!=null?m.awayScore:null) ]
  };
}
function ensureRealMatches(){
  if(!hasBackend()) return Promise.resolve([]);
  if(REAL_MATCHES) return Promise.resolve(REAL_MATCHES);
  if(REAL_MATCHES_PROMISE) return REAL_MATCHES_PROMISE;
  REAL_MATCHES_PROMISE = backendCall('matches', {}).then(function(res){
    REAL_MATCHES_PROMISE = null;
    REAL_MATCHES = (res && res.ok && res.matches) ? res.matches.map(normalizeRealMatch) : [];
    return REAL_MATCHES;
  }).catch(function(err){
    REAL_MATCHES_PROMISE = null;
    REAL_MATCHES = [];
    try{ console.error('[realMatches]', err); }catch(e){}
    return REAL_MATCHES;
  });
  return REAL_MATCHES_PROMISE;
}
function realTotalPredictionPoints(matches){
  var total=0;
  matches.forEach(function(m){
    var p = APP.predictions[m.id];
    var pts = predictionPoints(p, m);
    if(pts!==null) total += pts;
  });
  return total;
}
function teamNameMatchesProfile(name){
  var p = APP.profile; if(!p || !name) return false;
  var lname = name.toLowerCase();
  return p.teams.some(function(id){
    var t = TEAM_BY_ID[id]; if(!t) return false;
    var short = t.name.toLowerCase();
    return lname.indexOf(short)>-1 || short.indexOf(lname.replace(/\s*(fc|cf|afc)\.?$/i,'').trim())>-1;
  });
}
function realCrestHTML(url, name, size){
  size = size||24;

    return '<img class="crest" src="'+escapeHTML(url)+'" alt="" width="'+size+'" height="'+size+'" '+
      'style="object-fit:contain;" onerror="this.outerHTML=\'<span class=&quot;crest&quot; style=&quot;width:'+size+'px;height:'+size+'px;display:inline-flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;border-radius:50%;font-size:'+Math.round(size*0.4)+'px;font-weight:800;&quot;>'+escapeHTML((name||'?').charAt(0))+'</span>\'">';

}

/* ============================ QUIZ (10 random Qs, 10s timer, speed bonus) ============================ */
function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=a[i]; a[i]=a[j]; a[j]=tmp; } return a; }
function renderQuizIdle(){
  clearQuestionTimer();
  var el = document.getElementById('view-quiz');
  var best = APP.quizHistory.reduce(function(m,h){return Math.max(m,h.score);},0);
  el.innerHTML =
    '<div class="quiz-hero">'+
      '<h3>Football History Trivia</h3>'+
      '<p style="color:#C9D8F5;max-width:440px;">10 random questions from a bank of '+QUIZ_BANK.length+', all football history. You get 10 seconds per question — answer right and fast for up to 10 points; the slower the correct answer, the fewer points; a wrong answer or a timeout scores 0.</p>'+
      '<div class="quiz-stat-row">'+
        '<div class="quiz-stat"><b>'+APP.quizHistory.length+'</b><span>Rounds played</span></div>'+
        '<div class="quiz-stat"><b>'+best+'</b><span>Best score</span></div>'+
      '</div>'+
      '<button class="btn block" id="startQuiz" style="max-width:220px;">Start quiz</button>'+
    '</div>'+
    (APP.quizHistory.length? '<div class="section-head"><h2>Recent rounds</h2></div><div id="quizHist" class="grid"></div>' : '');
  document.getElementById('startQuiz').addEventListener('click', startQuiz);
  var hist = document.getElementById('quizHist');
  if(hist){
    hist.innerHTML = APP.quizHistory.slice(-6).reverse().map(function(h){
      return '<div class="card"><p class="muted" style="font-size:11.5px;">'+new Date(h.at).toLocaleDateString()+'</p><h4 style="font-size:22px;" class="mono">'+h.score+' / 100</h4><p class="muted" style="font-size:12.5px;">'+h.correct+' of '+h.total+' correct</p></div>';
    }).join('');
  }
}
function startQuiz(){
  APP.quiz = { qs: shuffle(QUIZ_BANK).slice(0,10), i:0, score:0, correct:0, answered:false, qStart:0, tickId:null, timeoutId:null };
  renderQuizQuestion();
}
function clearQuestionTimer(){
  var Q = APP.quiz; if(!Q) return;
  if(Q.tickId){ clearInterval(Q.tickId); Q.tickId=null; }
  if(Q.timeoutId){ clearTimeout(Q.timeoutId); Q.timeoutId=null; }
}
function renderQuizQuestion(){
  clearQuestionTimer();
  var el = document.getElementById('view-quiz');
  var Q = APP.quiz;
  if(Q.i >= Q.qs.length){ return finishQuiz(); }
  var q = Q.qs[Q.i];
  var cat = CATS[q.cat];
  var letters = ['A','B','C','D'];
  el.innerHTML =
    '<div class="quiz-hero">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;">'+
        '<span style="color:#9FB4E0;font-size:12.5px;font-weight:700;">QUESTION '+(Q.i+1)+' / '+Q.qs.length+'</span>'+
        '<span class="mono" style="font-size:12.5px;color:#9FB4E0;">SCORE '+Q.score+'</span>'+
      '</div>'+
      '<div class="qbar"><b style="width:'+(100*Q.i/Q.qs.length)+'%"></b></div>'+
      '<div class="qcatrow">'+icon(cat.icon,15)+'<span>'+cat.label+'</span></div>'+
      '<p class="qtext" style="color:#fff;">'+escapeHTML(q.q)+'</p>'+
      '<div class="timer-row"><div class="timerbar"><b id="timerFill" style="width:100%"></b></div><span class="timer-num" id="timerNum">'+Q_TIME+'s</span></div>'+
    '</div>'+
    '<div style="display:flex;flex-direction:column;gap:10px;" id="qopts">'+
      q.a.map(function(opt,i){
        return '<button class="qopt" data-i="'+i+'"><span class="letter">'+letters[i]+'</span><span>'+escapeHTML(opt)+'</span></button>';
      }).join('')+
    '</div>'+
    '<div id="qFeedbackSlot"></div>';
  document.querySelectorAll('.qopt').forEach(function(b){
    b.addEventListener('click', function(){ answerQuiz(parseInt(b.getAttribute('data-i'),10)); });
  });
  startQuestionTimer();
}
function startQuestionTimer(){
  var Q = APP.quiz;
  Q.qStart = Date.now();
  var fill = document.getElementById('timerFill');
  if(fill){
    fill.style.transition = 'none';
    fill.style.width = '100%';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        fill.style.transition = 'width '+Q_TIME+'s linear';
        fill.style.width = '0%';
      });
    });
  }
  Q.tickId = setInterval(function(){
    var left = Math.max(0, Q_TIME - (Date.now()-Q.qStart)/1000);
    var numEl = document.getElementById('timerNum');
    if(numEl) numEl.textContent = Math.ceil(left)+'s';
    if(left<=0){ clearInterval(Q.tickId); Q.tickId=null; }
  }, 150);
  Q.timeoutId = setTimeout(function(){ if(!Q.answered) timeUpQuiz(); }, Q_TIME*1000+60);
}
function revealOptions(q, chosenIdx){
  document.querySelectorAll('.qopt').forEach(function(b,idx){
    b.disabled = true;
    if(idx===q.c) b.classList.add('correct');
    else if(idx===chosenIdx) b.classList.add('wrong');
  });
}
function showQuizFeedback(html, cls){
  var slot = document.getElementById('qFeedbackSlot');
  if(slot) slot.innerHTML = '<div class="qfeedback '+cls+'">'+html+'</div>';
}
function answerQuiz(i){
  var Q = APP.quiz; if(!Q || Q.answered) return; Q.answered = true;
  clearQuestionTimer();
  var q = Q.qs[Q.i];
  var elapsed = (Date.now()-Q.qStart)/1000;
  var timeLeft = Math.max(0, Q_TIME-elapsed);
  var correct = i===q.c;
  var pts = 0;
  if(correct){
    pts = Math.max(4, Math.round(4 + 6*(timeLeft/Q_TIME)));
    Q.score += pts; Q.correct += 1;
  }
  revealOptions(q, i);
  var fill = document.getElementById('timerFill'); if(fill) fill.style.transition='none';
  if(correct) showQuizFeedback('Correct! +'+pts+' pts ('+timeLeft.toFixed(1)+'s left)', 'good');
  else showQuizFeedback('Not quite — the answer was "'+escapeHTML(q.a[q.c])+'"', 'bad');
  setTimeout(function(){ Q.i += 1; Q.answered = false; renderQuizQuestion(); }, 1100);
}
function timeUpQuiz(){
  var Q = APP.quiz; if(!Q || Q.answered) return; Q.answered = true;
  var q = Q.qs[Q.i];
  revealOptions(q, -1);
  var fill = document.getElementById('timerFill'); if(fill) fill.style.transition='none';
  showQuizFeedback('Time\'s up! The answer was "'+escapeHTML(q.a[q.c])+'"', 'bad');
  setTimeout(function(){ Q.i += 1; Q.answered = false; renderQuizQuestion(); }, 1100);
}
function finishQuiz(){
  var Q = APP.quiz;

/* ============================ PREDICTIONS (closeness-based scoring) ============================ */
function predictionPoints(pred, match){
  if(!match.finished || !pred) return null;
  var diff = Math.abs(pred.h-match.score[0]) + Math.abs(pred.a-match.score[1]);
  return Math.max(0, 10-diff);
}
function pointTier(pts){
  if(pts>=8) return 'tier-great';
  if(pts>=4) return 'tier-good';
  if(pts>=1) return 'tier-low';
  return 'tier-miss';
}
function myTotalPredictionPoints(){
  var total=0;
  MATCHES.forEach(function(m){
    var p = APP.predictions[m.id];
    var pts = predictionPoints(p, m);
    if(pts!==null) total += pts;
  });
  return total;
}
function renderPredictions(){
  var el = document.getElementById('view-predictions');
  if(hasBackend()){ renderPredictionsReal(el); return; }
  var upcoming = MATCHES.filter(function(m){return !m.finished;}).sort(function(a,b){return a.date-b.date;});
  var past = MATCHES.filter(function(m){return m.finished;}).sort(function(a,b){return b.date-a.date;});
  el.innerHTML =
    '<div class="section-head"><h2>Predictions</h2><p class="muted mono">'+myTotalPredictionPoints()+' pts banked</p></div>'+
    '<p class="muted" style="font-size:12.5px;">Scoring is closeness-based: 10 minus the total goal difference between your pick and the real score (minimum 0). An exact score is worth the full 10.</p>'+
    '<div class="card" style="gap:0;padding:4px 16px;"><div class="section-head" style="padding:10px 0;"><h3 style="font-size:16px;">Open fixtures</h3></div><div id="predOpen"></div></div>'+
    '<div class="card" style="gap:0;padding:4px 16px;"><div class="section-head" style="padding:10px 0;"><h3 style="font-size:16px;">Results</h3></div><div id="predDone"></div></div>';

  var openEl = document.getElementById('predOpen');
  openEl.innerHTML = upcoming.length ? upcoming.map(predRowHTML).join('') : '<p class="muted" style="padding:14px 0;">No upcoming fixtures to predict right now.</p>';
  var doneEl = document.getElementById('predDone');
  doneEl.innerHTML = past.length ? past.map(predRowHTML).join('') : '<p class="muted" style="padding:14px 0;">No results yet.</p>';

  wirePredSaveHandlers(renderPredictions);
}
function wirePredSaveHandlers(rerender){
  document.querySelectorAll('[data-pred-save]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-pred-save');
      var hEl = document.querySelector('input[data-h="'+id+'"]');
      var aEl = document.querySelector('input[data-a="'+id+'"]');
      var h = parseInt(hEl.value,10), a = parseInt(aEl.value,10);
      if(isNaN(h)||isNaN(a)||h<0||a<0){ hEl.style.borderColor='var(--bad)'; aEl.style.borderColor='var(--bad)'; return; }
      APP.predictions[id] = {h:h,a:a};
      save(scopedKey('tf_predictions'), APP.predictions);
      rerender();
    });
  });
}

  el.innerHTML =

    if(doneEl) doneEl.innerHTML = past.length ? past.map(realPredRowHTML).join('') : '<p class="muted" style="padding:14px 0;">No results yet.</p>';

  if(hasBackend()){ renderCalendarReal(el); return; }
  var filters = ['all','myteams'].concat(COMPETITIONS);
  var dayBtns = [];

  el.innerHTML =
    '<div class="section-head"><h2>Match calendar</h2></div>'+
    '<div class="daytabs" id="dayTabs">'+dayBtns.map(function(off){
      var d = new Date(TODAY.getTime()+off*86400000);
      var wk = d.toLocaleDateString([], {weekday:'short'});
      var dn = d.getDate();
      var active = APP.calDayOffset===off;
      return '<button class="daytab '+(active?'active':'')+'" data-off="'+off+'">'+(off===0?'Today':wk)+'<b>'+dn+'</b></button>';
    }).join('')+'</div>'+

  document.querySelectorAll('#dayTabs .daytab').forEach(function(b){
    b.addEventListener('click', function(){ APP.calDayOffset = parseInt(b.getAttribute('data-off'),10); renderCalendar(); });
  });
  document.querySelectorAll('#calChips .chip').forEach(function(c){
    c.addEventListener('click', function(){ APP.calFilter = c.getAttribute('data-f'); renderCalendar(); });
  });

  var selectedDate = new Date(TODAY.getTime()+APP.calDayOffset*86400000);
  var dateKey = selectedDate.toDateString();
  document.getElementById('calDateHead').textContent = dateHeadLabel(selectedDate);

  var list = MATCHES.filter(function(m){ return m.date.toDateString()===dateKey; }).sort(function(a,b){return a.date-b.date;});
  if(APP.calFilter==='myteams' && APP.profile){
    list = list.filter(function(m){ return APP.profile.teams.indexOf(m.home)>-1 || APP.profile.teams.indexOf(m.away)>-1; });

    list = list.filter(function(m){ return m.comp===APP.calFilter; });

    listEl.innerHTML = '<div class="empty">'+icon('calendar',34)+'<p><b>No fixtures on this day.</b></p><p class="muted">Try another day or filter.</p></div>';
    return;

  listEl.innerHTML = list.map(matchRowHTML).join('');

      return;
    }
    listEl.innerHTML = list.map(realMatchRowHTML).join('');
    wireMatchDetailButtons(listEl);

/* ============================ LEADERBOARD (online — 10 fixed bots, real players join as they sign up) ============================ */
var lbMetric = 'overall';
function loadLiveBoard(){ return load('tf_leaderboard_live', {}); }
function saveLiveBoard(b){ save('tf_leaderboard_live', b); }
function syncLeaderboardEntry(){
  if(!APP.userKey) return;
  var board = loadLiveBoard();
  var myQuiz = APP.quizHistory.reduce(function(s,h){return s+h.score;},0);
  var myPred = myTotalPredictionPoints();
  board[APP.userKey] = {name:APP.user, quiz:myQuiz, pred:myPred, updatedAt:Date.now()};
  saveLiveBoard(board);
}
function syncLeaderboardEntryReal(matches){
  if(!APP.userKey) return;
  var board = loadLiveBoard();
  var myQuiz = APP.quizHistory.reduce(function(s,h){return s+h.score;},0);
  var myPred = realTotalPredictionPoints(matches);
  board[APP.userKey] = {name:APP.user, quiz:myQuiz, pred:myPred, updatedAt:Date.now()};
  saveLiveBoard(board);
}
function renderLeaderboard(){
  if(hasBackend()){
    paintLeaderboard(); /* paint immediately with whatever's cached so it's not blank */
    ensureRealMatches().then(function(matches){ syncLeaderboardEntryReal(matches); paintLeaderboard(); });
    return;
  }
  syncLeaderboardEntry();
  paintLeaderboard();
}
function paintLeaderboard(){
  var el = document.getElementById('view-leaderboard');
  if(!el) return;
  var liveBoard = loadLiveBoard();
  var realRows = Object.keys(liveBoard).map(function(key){
    var u = liveBoard[key];
    return {name:u.name, quiz:u.quiz, pred:u.pred, overall:u.quiz+u.pred, me:(key===APP.userKey), kind:'online'};
  });
  var botRows = LEADERBOARD_SEED.map(function(u){ return {name:u.name, quiz:u.quiz, pred:u.pred, overall:u.quiz+u.pred, me:false, kind:'bot'}; });
  var rows = botRows.concat(realRows);

  var subtitle = realRows.length>0
    ? LEADERBOARD_SEED.length+' seeded bots · '+realRows.length+' real player'+(realRows.length===1?'':'s')+' signed up on this device'
    : LEADERBOARD_SEED.length+' seeded bots to start — real players appear here as people sign up and play';
  el.innerHTML =
    '<div class="section-head"><h2>Leaderboard</h2><p class="muted" style="font-size:11.5px;">'+subtitle+'</p></div>'+
    '<div class="tabs" id="lbTabs">'+
      '<button data-m="overall" class="'+(lbMetric==='overall'?'active':'')+'">Overall</button>'+
      '<button data-m="quiz" class="'+(lbMetric==='quiz'?'active':'')+'">Quiz</button>'+
      '<button data-m="pred" class="'+(lbMetric==='pred'?'active':'')+'">Predictions</button>'+
    '</div>'+
    '<div id="lbList" style="display:flex;flex-direction:column;gap:8px;"></div>';
  document.querySelectorAll('#lbTabs button').forEach(function(b){
    b.addEventListener('click', function(){ lbMetric=b.getAttribute('data-m'); renderLeaderboard(); });
  });
  rows.sort(function(a,b){ return b[lbMetric]-a[lbMetric]; });
  document.getElementById('lbList').innerHTML = rows.map(function(r,i){
    return '<div class="lb-row '+(r.me?'me':'')+'">'+
      '<span class="lb-rank '+(i<3?'top3':'')+'">'+(i+1)+'</span>'+
      '<span class="lb-name"><span class="avatar" style="width:26px;height:26px;font-size:11px;">'+initials(r.name)+'</span><span>'+escapeHTML(r.name)+(r.me?' (you)':'')+'</span>'+(r.kind==='bot'?'<span class="bottag">BOT</span>':'')+'</span>'+
      '<span class="lb-pts">'+r[lbMetric]+'</span>'+
    '</div>';
  }).join('');
}

      '<p class="ob-hint" style="margin-top:14px;max-width:280px;">'+(hasBackend()
        ? 'Passwords are hashed server-side in the connected Apps Script and stored in your Google Sheet, not in this page.'
        : 'Passwords are hashed (SHA-256 + a per-account salt) and stored only in this browser. This is a demo login, not a secure production authentication system.')+'</p>'+
    '</div>';
  document.getElementById('editPrefs').addEventListener('click', function(){ startOnboarding(true); });
  document.getElementById('changePw').addEventListener('click', openChangePasswordModal);
  document.getElementById('resetApp').addEventListener('click', openResetModal);
  document.getElementById('logoutBtn').addEventListener('click', function(){
    try{ localStorage.removeItem('tf_current_user'); localStorage.removeItem('tf_current_username'); }catch(e){}
    location.hash=''; location.reload();
  });
}

function openChangePasswordModal(){
  var html =
    '<div class="modal"><div class="modal-head"><h3>Change password</h3><button class="iconbtn" id="closeModal">'+icon('close',18)+'</button></div>'+
    '<label class="field">Current password<input type="password" id="pwOld"></label>'+
    '<label class="field">New password<input type="password" id="pwNew"></label>'+
    '<label class="field">Confirm new password<input type="password" id="pwNew2"></label>'+
    '<p class="ob-error" id="pwErr"></p>'+
    '<button class="btn block" id="pwSave">Save new password</button></div>';
  openModal(html);
  document.getElementById('pwSave').addEventListener('click', function(){
    var btn=this; var errEl=document.getElementById('pwErr');
    var oldPw=document.getElementById('pwOld').value, newPw=document.getElementById('pwNew').value, confirmPw=document.getElementById('pwNew2').value;
    if(!newPw || newPw.length<4){ errEl.textContent='New password must be at least 4 characters.'; return; }
    if(newPw!==confirmPw){ errEl.textContent='New passwords do not match.'; return; }
    btn.disabled=true; btn.textContent='Checking…';
    if(hasBackend()){
      backendCall('changePassword', {username:APP.user, oldPassword:oldPw, newPassword:newPw}).then(function(res){
        if(!res || !res.ok){ errEl.textContent=(res&&res.error)||'Current password is incorrect.'; btn.disabled=false; btn.textContent='Save new password'; return; }
        closeModal();
      }).catch(function(){ errEl.textContent='Could not reach the server.'; btn.disabled=false; btn.textContent='Save new password'; });
      return;
    }
    var accounts=loadAccounts(); var acc=accounts[APP.userKey];
    sha256Hex(acc.salt+oldPw).then(function(hash){
      if(hash!==acc.hash){ errEl.textContent='Current password is incorrect.'; btn.disabled=false; btn.textContent='Save new password'; return; }
      var newSalt=randSalt();
      sha256Hex(newSalt+newPw).then(function(newHash){
        acc.salt=newSalt; acc.hash=newHash; accounts[APP.userKey]=acc; saveAccounts(accounts);
        closeModal();
      });
    });
  });
}

function openResetModal(){
  var html =
    '<div class="modal"><div class="modal-head"><h3>Reset all data</h3><button class="iconbtn" id="closeModal">'+icon('close',18)+'</button></div>'+
    '<p class="muted" style="font-size:13px;">This clears your preferences, tutorial progress, predictions and quiz history on this device. Your account itself stays, so you can log back in and start fresh. Enter your password to confirm.</p>'+
    '<label class="field">Password<input type="password" id="resetPw"></label>'+
    '<p class="ob-error" id="resetErr"></p>'+
    '<button class="btn block" style="background:var(--bad);" id="confirmReset">Confirm reset</button></div>';
  openModal(html);
  document.getElementById('confirmReset').addEventListener('click', function(){
    var btn=this; var errEl=document.getElementById('resetErr');
    var pw=document.getElementById('resetPw').value;
    btn.disabled=true; btn.textContent='Checking…';
    if(hasBackend()){
      backendCall('login', {username:APP.user, password:pw}).then(function(res){
        if(!res || !res.ok){ errEl.textContent='Incorrect password.'; btn.disabled=false; btn.textContent='Confirm reset'; return; }
        doReset();
      }).catch(function(){ errEl.textContent='Could not reach the server.'; btn.disabled=false; btn.textContent='Confirm reset'; });
      return;
    }
    var accounts=loadAccounts(); var acc=accounts[APP.userKey];
    sha256Hex(acc.salt+pw).then(function(hash){
      if(hash!==acc.hash){ errEl.textContent='Incorrect password.'; btn.disabled=false; btn.textContent='Confirm reset'; return; }
      doReset();
    });
  });
}
function doReset(){
  [scopedKey('tf_profile'),scopedKey('tf_tut_progress'),scopedKey('tf_predictions'),scopedKey('tf_quiz_history')].forEach(function(k){ try{localStorage.removeItem(k);}catch(e){} });
  closeModal();
  location.hash=''; location.reload();
}

/* ============================ MODAL ============================ */
function openModal(html){
  var root = document.getElementById('modal-root');
  root.innerHTML = '<div class="modal-wrap" id="modalWrap">'+html+'</div>';
  document.getElementById('modalWrap').addEventListener('click', function(e){ if(e.target.id==='modalWrap') closeModal(); });
  var cm = document.getElementById('closeModal'); if(cm) cm.addEventListener('click', closeModal);
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ============================ AUTH (login / sign up) ============================ */
function showAuth(){
  document.getElementById('shell').hidden = true;
  document.getElementById('onboarding').hidden = false;
  APP.auth = { mode:'login', username:'', password:'', confirm:'', error:'', busy:false };
  renderAuth();
}
function renderAuth(){
  var a = APP.auth;
  var isSignup = a.mode==='signup';
  var html =
    '<div class="ob-card">'+
      '<div class="ob-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.3 16 10l-1.5 4.7h-5L8 10z"/></svg><b>TheFootballer</b></div>'+
      '<div class="authtabs"><button data-mode="login" class="'+(!isSignup?'active':'')+'">Log in</button><button data-mode="signup" class="'+(isSignup?'active':'')+'">Sign up</button></div>'+
      '<div class="ob-step">'+
        '<h3>'+(isSignup?'Create your account':'Welcome back')+'</h3>'+
        '<p class="sub">'+(isSignup?'Pick a username and password to start following teams and playing games.':'Log in to pick up your news, predictions and quiz scores.')+'</p>'+
        '<label class="field">Username<input type="text" id="authUsername" maxlength="20" placeholder="e.g. PitchProphet" value="'+escapeHTML(a.username)+'"></label>'+
        '<label class="field">Password<input type="password" id="authPassword" placeholder="At least 4 characters"></label>'+
        (isSignup? '<label class="field">Confirm password<input type="password" id="authConfirm"></label>' : '')+
        '<p class="ob-error" id="authErr">'+escapeHTML(a.error)+'</p>'+
      '</div>'+
      '<div class="ob-actions"><span></span><button class="btn" id="authSubmit" '+(a.busy?'disabled':'')+'>'+(a.busy?'Please wait…':(isSignup?'Create account':'Log in'))+'</button></div>'+
      '<p class="ob-hint">'+(hasBackend()
        ? 'Accounts and passwords are stored in the connected Google Sheet backend — hashed server-side in Apps Script, never in this page.'
        : 'This is a client-side demo: accounts and passwords are stored only in this browser (hashed, not in plain text) — not a real backend, so don\'t reuse a password you use elsewhere.')+'</p>'+
    '</div>';
  document.getElementById('onboarding').innerHTML = html;
  document.querySelectorAll('[data-mode]').forEach(function(b){
    b.addEventListener('click', function(){
      APP.auth.mode = b.getAttribute('data-mode');
      APP.auth.error=''; renderAuth();
    });
  });
  document.getElementById('authUsername').addEventListener('input', function(e){ a.username=e.target.value; });
  document.getElementById('authPassword').addEventListener('input', function(e){ a.password=e.target.value; });
  var confirmEl = document.getElementById('authConfirm');
  if(confirmEl) confirmEl.addEventListener('input', function(e){ a.confirm=e.target.value; });
  document.getElementById('authSubmit').addEventListener('click', handleAuthSubmit);
}
function handleAuthSubmit(){
  var a = APP.auth;
  var uname = a.username.trim();
  var key = uname.toLowerCase();
  if(!uname){ a.error='Enter a username.'; renderAuth(); return; }
  if(!a.password || a.password.length<4){ a.error='Password must be at least 4 characters.'; renderAuth(); return; }
  if(a.mode==='signup' && a.password!==a.confirm){ a.error='Passwords do not match.'; renderAuth(); return; }
  a.busy = true; a.error=''; renderAuth();

  if(hasBackend()){
    /* password hashing happens server-side in the Apps Script; we only send it over HTTPS */
    backendCall(a.mode, {username:uname, password:a.password}).then(function(res){
      if(!res || !res.ok){ a.busy=false; a.error=(res&&res.error)||'Something went wrong.'; renderAuth(); return; }
      finishLogin(key, uname);
    }).catch(function(){ a.busy=false; a.error='Could not reach the server. Check the Apps Script URL and your connection.'; renderAuth(); });
    return;
  }

  /* local-only demo fallback: hashed client-side, stored only in this browser */
  var accounts = loadAccounts();
  if(a.mode==='signup'){
    if(accounts[key]){ a.busy=false; a.error='That username is already taken.'; renderAuth(); return; }
    var salt = randSalt();
    sha256Hex(salt+a.password).then(function(hash){
      accounts[key] = {username:uname, salt:salt, hash:hash};
      saveAccounts(accounts);
      finishLogin(key, uname);
    });
  } else {
    var acc = accounts[key];
    if(!acc){ a.busy=false; a.error='No account with that username. Try signing up.'; renderAuth(); return; }
    sha256Hex(acc.salt+a.password).then(function(hash){
      if(hash!==acc.hash){ a.busy=false; a.error='Incorrect password.'; renderAuth(); return; }
      finishLogin(key, acc.username);
    });
  }
}
function finishLogin(key, uname){
  save('tf_current_user', key);
  save('tf_current_username', uname);
  APP.userKey = key; APP.user = uname;
  loadUserData();
  if(APP.profile){ enterApp(); } else { startOnboarding(false); }
}

/* ============================ ONBOARDING (country / teams / competitions) ============================ */
function startOnboarding(editing){
  APP.ob = editing && APP.profile
    ? { step:1, country:APP.profile.country, teams:APP.profile.teams.slice(), comps:APP.profile.comps.slice() }
    : { step:1, country:null, teams:[], comps:[] };
  document.getElementById('shell').hidden = true;
  document.getElementById('onboarding').hidden = false;
  renderOnboarding();
}
function renderOnboarding(){
  var ob = APP.ob;
  var steps = [null,'country','teams','comps'];
  var kind = steps[ob.step];
  var dots = [1,2,3].map(function(i){ return '<i class="'+(i<=ob.step?'on':'')+'"></i>'; }).join('');
  var body = '';
  var MAX_TEAMS = 8;

  if(kind==='country'){
    body =
      '<div class="ob-step">'+
        '<h3>Pick your country</h3><p class="sub">We\'ll surface news and competitions local to you.</p>'+
        '<div class="pickgrid single">'+COUNTRIES.map(function(c){
          return '<button class="pickitem '+(ob.country===c?'sel':'')+'" data-country="'+escapeHTML(c)+'" style="justify-content:center;text-align:center;">'+escapeHTML(c)+'</button>';
        }).join('')+'</div>'+
        '<p class="ob-error" id="obErr"></p>'+
      '</div>';
  } else if(kind==='teams'){
    body =
      '<div class="ob-step">'+
        '<h3>Pick your favourite team(s)</h3><p class="sub">Choose up to '+MAX_TEAMS+' — your "For You" feed is built around these.</p>'+
        '<div class="ob-counter">'+ob.teams.length+' / '+MAX_TEAMS+' selected</div>'+
        '<div class="pickgrid">'+TEAMS.map(function(t){
          return '<button class="pickitem '+(ob.teams.indexOf(t.id)>-1?'sel':'')+'" data-team="'+t.id+'">'+crestSVG(t.id,26)+'<span>'+escapeHTML(t.name)+'<small>'+escapeHTML(t.country)+'</small></span></button>';
        }).join('')+'</div>'+
        '<p class="ob-error" id="obErr"></p>'+
      '</div>';
  } else if(kind==='comps'){
    body =
      '<div class="ob-step">'+
        '<h3>Follow some competitions</h3><p class="sub">Pick the leagues and cups you want in your calendar and feed.</p>'+
        '<div class="ob-counter">'+ob.comps.length+' selected</div>'+
        '<div class="pickgrid">'+COMPETITIONS.map(function(c){
          return '<button class="pickitem '+(ob.comps.indexOf(c)>-1?'sel':'')+'" data-comp="'+escapeHTML(c)+'" style="grid-template-columns:none;">'+escapeHTML(c)+'</button>';
        }).join('')+'</div>'+
        '<p class="ob-error" id="obErr"></p>'+
      '</div>';
  }

  document.getElementById('onboarding').innerHTML =
    '<div class="ob-card">'+
      '<div class="ob-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.3 16 10l-1.5 4.7h-5L8 10z"/></svg><b>TheFootballer</b></div>'+
      '<div class="ob-progress">'+dots+'</div>'+
      body+
      '<div class="ob-actions">'+
        (ob.step>1 ? '<button class="btn subtle" id="obBack">Back</button>' : '<span></span>')+
        '<button class="btn" id="obNext">'+(ob.step===3?'Enter TheFootballer':'Continue')+'</button>'+
      '</div>'+
    '</div>';

  if(kind==='country'){
    document.querySelectorAll('[data-country]').forEach(function(b){
      b.addEventListener('click', function(){ ob.country = b.getAttribute('data-country'); renderOnboarding(); });
    });
  }
  if(kind==='teams'){
    document.querySelectorAll('[data-team]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-team');
        var idx = ob.teams.indexOf(id);
        if(idx>-1) ob.teams.splice(idx,1);
        else if(ob.teams.length<MAX_TEAMS) ob.teams.push(id);
        renderOnboarding();
      });
    });
  }
  if(kind==='comps'){
    document.querySelectorAll('[data-comp]').forEach(function(b){
      b.addEventListener('click', function(){
        var c = b.getAttribute('data-comp');
        var idx = ob.comps.indexOf(c);
        if(idx>-1) ob.comps.splice(idx,1); else ob.comps.push(c);
        renderOnboarding();
      });
    });
  }
  if(ob.step>1){ document.getElementById('obBack').addEventListener('click', function(){ ob.step -= 1; renderOnboarding(); }); }
  document.getElementById('obNext').addEventListener('click', function(){ onboardingNext(); });
}
function onboardingNext(){
  var ob = APP.ob;
  var err = document.getElementById('obErr');
  if(ob.step===1){
    if(!ob.country){ if(err) err.textContent='Pick a country to continue.'; return; }
  }
  if(ob.step===2){
    if(ob.teams.length===0){ if(err) err.textContent='Pick at least one team.'; return; }
  }
  if(ob.step===3){
    if(ob.comps.length===0){ if(err) err.textContent='Pick at least one competition.'; return; }
    APP.profile = { country: ob.country, teams: ob.teams.slice(), comps: ob.comps.slice() };
    save(scopedKey('tf_profile'), APP.profile);
    enterApp();
    return;
  }
  ob.step += 1;
  renderOnboarding();
}

/* ============================ BOOT ============================ */
function enterApp(){
  document.getElementById('onboarding').hidden = true;
  document.getElementById('shell').hidden = false;
  document.getElementById('userAvatar').textContent = initials(APP.user);
  document.getElementById('userNameChip').textContent = APP.user;
  document.getElementById('profileChip').onclick = function(){ showView('profile'); };
  var startView = (location.hash||'').replace('#','');
  var valid = NAV_ITEMS.some(function(n){return n.id===startView;});
  showView(valid?startView:'home');
}
function applyTheme(){
  var t = load('tf_theme', null);
  if(t) document.documentElement.setAttribute('data-theme', t);
  updateThemeIcon();
}
function updateThemeIcon(){
  var t = document.documentElement.getAttribute('data-theme');
  var dark = t==='dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('themeToggle').innerHTML = icon(dark?'sun':'moon',18);
}
function boot(){
  buildNav();
  applyTheme();
  document.getElementById('themeToggle').addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme');
    var dark = cur==='dark' || (!cur && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    save('tf_theme', next);
    updateThemeIcon();
  });
  var cur = load('tf_current_user', null);
  if(cur){
    var validSession = hasBackend() || loadAccounts()[cur];
    if(validSession){
      APP.userKey = cur;
      APP.user = load('tf_current_username', cur);
      loadUserData();
      if(APP.profile){ enterApp(); return; }
      startOnboarding(false);
      return;
    }
  }
  showAuth();
}

try{
  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return { view: APP.view }; });
    if(window.claude.hot.ready){
      window.claude.hot.ready(function(data){ boot(); if(data && data.view){ try{ if(APP.profile) showView(data.view); }catch(e){} } });
    } else { boot(); }
  } else { boot(); }
}catch(e){ boot(); }

})();
</script>
